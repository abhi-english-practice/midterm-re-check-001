<dialog id="vocabDialog"><div id="vocabInner"></div></dialog><script id="lesson-data" type="application/json">{"passages": [{"title": "Healthier habits, stronger connections", "paragraphs": ["At the beginning of the school year, sixteen-year-old Linh often felt tired in class. She went to bed late, skipped breakfast and spent most evenings watching videos. She believed that getting healthier required expensive equipment and hours of exercise. Her school nurse, however, suggested starting with small changes that fitted her daily life.", "Linh began walking for fifteen minutes after dinner with her father. She also replaced some sugary drinks with water and started reading food labels. Instead of giving up every food she enjoyed, she paid attention to how often she ate it. Over the past two months, she has become more active and has found it easier to concentrate. Her father has benefited too: their walks give them time to talk without checking their phones.", "Changing her sleeping habits was more difficult. Linh used to take her phone to bed because she worried about missing messages. Now she turns it off thirty minutes before bedtime and leaves it outside her bedroom. She does not always fall asleep immediately, but she usually feels more refreshed the next morning.", "The nurse explains that healthy habits do not guarantee a life without illness. Living conditions and access to medical care also influence health. Nevertheless, realistic habits are often easier to maintain than extreme plans. Linh’s aim is to make choices she can continue, rather than follow a perfect routine for only a few days."], "complete": ["At the beginning of the school year, sixteen-year-old Linh often felt tired in class. She went to bed late, skipped breakfast and spent most evenings watching videos. She believed that getting healthier required expensive equipment and hours of exercise. Her school nurse, however, suggested starting with small changes that fitted her daily life.", "Linh began walking for fifteen minutes after dinner with her father. She also replaced some sugary drinks with water and started reading food labels. Instead of giving up every food she enjoyed, she paid attention to how often she ate it. Over the past two months, she has become more active and has found it easier to concentrate. Her father has benefited too: their walks give them time to talk without checking their phones.", "Changing her sleeping habits was more difficult. Linh used to take her phone to bed because she worried about missing messages. Now she turns it off thirty minutes before bedtime and leaves it outside her bedroom. She does not always fall asleep immediately, but she usually feels more refreshed the next morning.", "The nurse explains that healthy habits do not guarantee a life without illness. Living conditions and access to medical care also influence health. Nevertheless, realistic habits are often easier to maintain than extreme plans. Linh’s aim is to make choices she can continue, rather than follow a perfect routine for only a few days."], "vi": [["Đầu năm học, Linh, một học sinh mười sáu tuổi, thường cảm thấy mệt mỏi trong lớp.", "Cô đi ngủ muộn, bỏ bữa sáng và dành phần lớn các buổi tối để xem video.", "Cô tin rằng muốn khỏe hơn thì cần thiết bị đắt tiền và nhiều giờ tập thể dục.", "Tuy nhiên, nhân viên y tế trường khuyên cô bắt đầu bằng những thay đổi nhỏ phù hợp với sinh hoạt hằng ngày."], ["Linh bắt đầu đi bộ mười lăm phút sau bữa tối cùng bố.", "Cô cũng thay một phần đồ uống có đường bằng nước và bắt đầu đọc nhãn thực phẩm.", "Thay vì từ bỏ mọi món mình thích, cô chú ý đến tần suất ăn chúng.", "Trong hai tháng qua, cô đã năng động hơn và thấy mình dễ tập trung hơn.", "Bố cô cũng được hưởng lợi: những buổi đi bộ cho hai bố con thời gian trò chuyện mà không kiểm tra điện thoại."], ["Thay đổi thói quen ngủ khó hơn.", "Trước đây Linh thường mang điện thoại lên giường vì lo bỏ lỡ tin nhắn.", "Giờ đây cô tắt điện thoại trước giờ ngủ ba mươi phú  everything. It means trying to understand someone before making a decision. For Minh’s family, calm discussion was more useful than proving who was right."], "complete": ["Minh wanted to join a weekend photography club, but his mother refused. She believed it would distract him from his studies. Minh felt that she did not trust him, while she thought he was ignoring her concerns. Their discussion soon became an argument, and neither listened carefully.", "At the next family meeting, Minh’s grandmother suggested a different approach. Each person would explain their opinion without interruption. Minh’s mother said she worried about unfinished homework and travel costs. Minh explained that the club met only twice a month and that a direct bus stopped near it. He also showed her a timetable that included schoolwork and household chores.", "They agreed on a one-month trial. Minh would finish his homework before attending and contribute to the travel costs with his savings. His mother would review the arrangement after four weeks instead of rejecting it immediately. These conditions helped both of them feel that their views mattered.", "Differences between generations do not disappear after one conversation. Parents and children may have different experiences, expectations and values. However, keeping an open mind can prevent differences from becoming serious conflicts. Listening does not mean agreeing with everything. It means trying to understand someone before making a decision. For Minh’s family, calm discussion was more useful than proving who was right."], "vi": [["Minh muốn tham gia câu lạc bộ nhiếp ảnh cuối tuần nhưng mẹ từ chối.", "Bà tin rằng việc đó sẽ khiến cậu xao nhãng học tập.", "Minh cảm thấy mẹ không tin mình, còn mẹ cho rằng cậu phớt lờ những lo lắng của bà.", "Cuộc thảo luận nhanh chóng trở thành tranh cãi và không ai lắng nghe cẩn thận."], ["Trong cuộc họp gia đình tiếp theo, bà của Minh đề xuất một cách tiếp cận khác.", "Mỗi người sẽ trình bày ý kiến m viết một bài hát ngắn.", "Ông cũng cho Nam sử dụng cây đàn phím cũ của mình.", "Nam luyện tập mỗi tối nhưng mãi đến sự kiện cộng đồng mới biểu diễn trước công chúng.", "Trước buổi diễn, cậu rất hồi hộp.", "Ông nhắc cậu thở chậm và tận hưởng trải nghiệm."], ["Đêm nhạc kết hợp giai điệu cũ với cách phối mới.", "Một số học sinh chơi nhạc cụ truyền thống, trong khi những em khác hát ca khúc hiện đại.", "Khán giả ngưỡng mộ các nghệ sĩ trẻ vì nỗ lực của họ.", "Một số cư dân ngạc nhiên trước sự hòa hợp của các phong cách khác nhau."], ["Sau sự kiện, ban tổ chức xin phép chia sẻ những video ngắn lên mạng.", "Họ giải thích rằng học sinh không nên phát tán bản thu khi chưa có sự cho phép cần thiết.", "Thu âm và phát hành bài hát là hai việc khác nhau: trước tiên phải tạo ra bản ghi rồi mới có thể đưa đến công chúng."], ["Sự kiện không khiến mọi người đồng ý về mọi thứ.", "Tuy nhiên, nó cho họ cơ hội học hỏi lẫn nhau.", "Giờ đây Nam chú ý hơn đến những câu chuyện đằng sau bài hát truyền thống.", "Ông của cậu đã cởi mở hơn với ý tưởng âm nhạc mới."]], "sentences": [{"en": "When a youth centre planned a music evening, its organisers invited teenagers and older residents to work together.", "vi": "Khi một trung tâm thanh thiếu niên lên kế hoạch cho đêm nhạc, ban tổ chức mời người trẻ và cư dân lớn tuổi cùng tham gia.", "paragraph": 0, "chunks": ["When a youth centre planned a music evening,", "its organisers invited", "teenagers and older residents", "to work together."]}, {"en": "They wanted the event to appeal to people of different ages.", "vi": "Họ muốn sự kiện thu hút người ở nhiều độ tuổi.", "paragraph": 0, "chunks": ["They wanted the event", "to appeal to", "people of different ages."]}, {"en": "Seventeen-year-old Nam joined the team because he was interested in music production.", "vi": "Nam, mười bảy tuổi, tham gia nhóm vì quan tâm đến sản xuất âm nhạc.", "paragraph": 0, "chunks": ["Seventeen-year-old Nam joined the team", "because he was interested in", "music product m in public", "until the community event."]}, {"en": "Before the performance, he was nervous.", "vi": "Trước buổi diễn, cậu rất hồi hộp.", "paragraph": 2, "chunks": ["Before the performance,", "he was", "nervous."]}, {"en": "His grandfather reminded him to breathe slowly and enjoy the experience.", "vi": "Ông nhắc cậu thở chậm và tận hưởng trải nghiệm.", "paragraph": 2, "chunks": ["His grandfather reminded him", "to breathe slowly", "and enjoy the experience."]}, {"en": "The evening included a mixture of old melodies and new arrangements.", "vi": "Đêm nhạc kết hợp giai điệu cũ với cách phối mới.", "paragraph": 3, "chunks": ["The evening included", "a mixture of", "old melodies and new arrangements."]}, {"en": "Several students played traditional instruments, while others sang modern songs.", "vi": "Một số học sinh chơi nhạc cụ truyền thống, trong khi những em khác hát ca khúc hiện đại.", "paragraph": 3, "chunks": ["Several students played traditional instruments,", "while others", "sang modern songs."]}, {"en": "The audience admired the young performers for their effort.", "vi": "Khán giả ngưỡng mộ các nghệ sĩ trẻ vì nỗ lực của họ.", "paragraph": 3, "chunks": ["The audience admired", "the young performers", "for their effort."]}, {"en": "Some residents were surprised at how well the different styles worked together.", "vi": "Một số cư dân ngạc nhiên trước sự hòa hợp của các phong cách khác nhau.", "paragraph": 3, "chunks": ["Some residents were surprised at", "how well", "the different styles worked together."]}, {"en": "After the event, the organisers asked permission to share short videos online.", "vi": "Sau sự kiện, ban tổ chức xin phép chia sẻ những video ngắn lên mạng.", "paragraph": 4, "chunks": ["After the event,", "the organisers asked permission", "to share short videos online."]}, {"en": "They explained that students should not distribute recordings without getting the necessary permission.", "vi": "Họ giải thích rằng học sinh không nên phát tán bản thu khi chưa có sự cho phép cần thiết.", "paragraph": 4, "chunks": ["They explained that", "students should not distribute recordings", "without getting the necessary permission."]}, {"en": "Recording a song and releasing it are different: the recording must first be created before it can be made available to the public.", "vi": "Thu âm và phát hành bài hát là hai việc khác nhau: trước tiên phải tạo ra bản ghi rồi mới có thể đưa đến công chúng.", "paragraph": 4, "chunks": ["Recording a song and releasing it are different:", "the recording must first be created", "before it can be made available to the public."]}, {"en": "The event did not make everyone agree on everything.", "vi": "Sự kiện không khiến mọi người đồng ý về mọi thứ.", "paragraph": 5, "chunks": ["The event did not make", "everyone agree", "on everything."]}, {"en": "However, it gave them a chance to learn from one another.", "vi": "Tuy nhiên, nó cho họ cơ hội học hỏi lẫn nhau.", "paragraph": 5, "chunks": ["However,", "it gave them a chance", "to learn from one another."]}, {"en": "Nam now pays more attention to the stories behind traditional songs.", "vi": "Giờ đây Nam chú ý hơn đến những câu chuyện đằng sau bài hát truyền thống.", "paragraph": 5, "chunks": ["Nam now pays more attention to", "the stories", "behind traditional songs."]}, {"en": "His grandfather has become more open to new musical ideas.", "vi": "Ông của cậu đã cởi mở hơn với ý tưởng âm nhạc mới.", "paragraph": 5, "chunks": ["His grandfather has become", "more open to", "new musical ideas."]}], "vocab": [{"term": "appeal to", "vi": "thu hút, hấp dẫn ai", "kind": "Grammar pattern", "sentence": 1}, {"term": "interested in", "vi": "quan tâm, hứng thú với", "kind": "Grammar pattern", "sentence": 2}, {"term": "took part in", "vi": "tham gia", "kind": "Collocation", "sentence": 3}, {"term": "favourite recordings", "vi": "những bản thu yêu thích", "kind": "Collocation", "sentence": 6}, {"term": "in public", "vi": "trước công chúng", "kind": "Useful c } protected. The council must deal {96} these concerns rather than ignore them.", "A smart city should not depend {97} technology alone. It also needs people who are willing {98} listen and cooperate. Brookfield’s projects have shown that quality {99} life can improve when services respond to different needs. The aim is to create a city where everyone can take part {100} community life."], "complete": ["Brookfield wants to become a more liveable city. Over the past two years, the council has introduced several projects to improve public services. New sensors help street lights switch off when roads are empty. This reduces the amount of electricity used at night.", "The council has also created a garden on the roof of a public library. The plants provide habitats for insects and help improve air quality. Local schools use the garden to teach students about nature. Spending time there can be beneficial to both physical and mental health.", "Green roofs cannot replace every park. However, they make room for plants in areas where land is limited. They also help residents connect with nature without travelling far. Visitors are asked not to pick flowers or disturb the insects.", "Another project allows residents to book appointments online instead of travelling to an office. Many people find this convenient, but some older residents do not know how to use the website. Others have no access to a reliable internet connection. For this reason, telephone bookings are still available.", "The council encourages residents to give feedback so that services can be improved. Some people have asked for safer walking routes. Others want to know how their personal information will be protected. The council must deal with these concerns rather than ignore them.", "A smart city should not depend on technology alone. It also needs people who are willing to listen and cooperate. Brookfield’s projects have shown that quality of life can improve when services respond to different needs. The aim is to create a city where everyone can take part in community life."], "vi": [["Brookfield muốn trở thành một thành phố đáng sống hơn.", "Trong hai năm qua, hội đồng thành phố đã triển khai nhiều dự án cải thiện dịch vụ công.", "Cảm biến mới giúp đèn đường tắt khi đường vắng.", "Điều này giảm lượng điện sử dụng vào ban đêm."], ["Hội đồng cũng đã tạo một khu vườn trên mái thư viện công cộng.", "Cây cối tạo môi trường sống cho côn trùng và góp phần cải thiện chất lượng không khí.", "Các trường địa phương dùng khu vườn để dạy học sinh về thiên nhiên.", "Dành thời gian ở đó có thể có lợi cho sức khỏe thể chất lẫn tinh thần."], ["Vườn mái không thể thay thế mọi công viên.", "Tuy nhiên, chúng dành không gian cho cây ở nơi đất đai hạn chế.", "Chúng cũng giúp cư dân kết nối với thiên nhiên mà không phải đi xa.", "Khách được yêu cầu không hái hoa hoặc làm phiền côn trùng."], ["Một dự án khác cho phép cư dân đặt lịch hẹn trực tuyến thay vì đến văn phòng.", "Nhiều người thấy thuận tiện, nhưng một số cư dân lớn tuổi không biết cách dùng website.", "Những người khác không có điều kiện tiếp cận kết nối internet ổn định.", "Vì vậy, hình thức đặt lịch qua điện thoại vẫn được duy trì."], ["Hội đồng khuyến khích cư dân phản hồi để dịch vụ có thể được cải thiện.", "Một số người đề nghị có tuyến đi bộ an toàn hơn.", "Những người khác muốn biết thông tin cá nhân sẽ được bảo vệ thế nào.", "Hội đồng phải xử lý những lo ngại này thay vì phớt lờ."], ["Thành phố thông minh không nên chỉ phụ thuộc vào công nghệ.", "Thành phố cũng cần những người sẵn lòng lắng nghe và hợp tác.", "Các dự án của Brookfield cho thấy chất lượng sống có thể cải thiện khi dịch vụ đáp ứng nhu cầu khác nhau.", "Mục tiêu là tạo một thành phố nơi mọi người đều có thể tham gia đời sống cộng đồng."]], "sentences": [{"en": "Brookfield wants to become a more liveable city.", "vi": "Brookfield muốn trở thành một thành phố đáng sống hơn.", "paragraph": 0, "chunks": ["Brookfield wants", "to become", "a more liveable city rvices can be improved.", "vi": "Hội đồng khuyến khích cư dân phản hồi để dịch vụ có thể được cải thiện.", "paragraph": 4, "chunks": ["The council encourages residents", "to give feedback", "so that services can be improved."]}, {"en": "Some people have asked for safer walking routes.", "vi": "Một số người đề nghị có tuyến đi bộ an toàn hơn.", "paragraph": 4, "chunks": ["Some people", "have asked for", "safer walking routes."]}, {"en": "Others want to know how their personal information will be protected.", "vi": "Những người khác muốn biết thông tin cá nhân sẽ được bảo vệ thế nào.", "paragraph": 4, "chunks": ["Others want to know", "how their personal information", "will be protected."]}, {"en": "The council must deal with these concerns rather than ignore them.", "vi": "Hội đồng phải xử lý những lo ngại này thay vì phớt lờ.", "paragraph": 4, "chunks": ["The council must deal with", "these concerns", "rather than ignore them."]}, {"en": "A smart city should not depend on technology alone.", "vi": "Thành phố thông minh không nên chỉ phụ thuộc vào công nghệ.", "paragraph": 5, "chunks": ["A smart city", "should not depend on", "technology alone."]}, {"en": "It also needs people who are willing to listen and cooperate.", "vi": "Thành phố cũng cần những người sẵn lòng lắng nghe và hợp tác.", "paragraph": 5, "chunks": ["It also needs", "people who are willing", "to listen and cooperate."]}, {"en": "Brookfield’s projects have shown that quality of life can improve when services respond to different needs.", "vi": "Các dự án của Brookfield cho thấy chất lượng sống có thể cải thiện khi dịch vụ đáp ứng nhu cầu khác nhau.", "paragraph": 5, "chunks": ["Brookfield’s projects have shown that", "quality of life can improve", "when services respond to different needs."]}, {"en": "The aim is to create a city where everyone can take part in community life.", "vi": "Mục tiêu là tạo một thành phố nơi mọi người đều có thể tham gia đời sống cộng đồng.", "paragraph": 5, "chunks": ["The aim is to create a city", "where everyone can take part in", "community life."]}], "vocab": [{"term": "liveable city", "vi": "thành phố đáng sống", "kind": "Collocation", "sentence": 0}, {"term": "public services", "vi": "dịch vụ công", "kind": "Collocation", "sentence": 1}, {"term": "switch off", "vi": "tắt", "kind": "Phrasal verb", "sentence": 2}, {"term": "improve air quality", "vi": "cải thiện chất lượng không khí", "kind": "Collocation", "sentence": 5}, {"term": "beneficial to", "vi": "có lợi cho", "kind": "Grammar pattern", "sentence": 7}, {"term": "make room for", "vi": "dành không gian cho", "kind": "Collocation", "sentence": 9}, {"term": "connect with nature", "vi": "kết nối với thiên nhiên", "kind": "Collocation", "sentence": 10}, {"term": "book appointments", "vi": "đặt lịch hẹn", "kind": "Collocation", "sentence": 12}, {"term": "reliable internet connection", "vi": "kết nối internet ổn định", "kind": "Collocation", "sentence": 14}, {"term": "give feedback", "vi": "đưa ra phản hồi", "kind": "Collocation", "sentence": 16}, {"term": "deal with", "vi": "xử lý", "kind": "Phrasal verb", "sentence": 19}, {"term": "quality of life", "vi": "chất lượng cuộc sống", "kind": "Collocation", "sentence": 22}]}], "questions": [{"id": 1, "type": "mc", "prompt": "What is the best title?", "options": ["The Disadvantages of Walking after Dinner", "Why Every Teenager Needs a Strict Diet", "Small Changes That Support Health and Family Life", "How to Avoid Medical Care"], "answers": ["C"], "en": "The passage combines healthier habits with family connection.", "vi": "Bài kết hợp thói quen lành mạnh với sự gắn kết gia đình.", "evidence": "Her school nurse, however, suggested starting with small changes that fitted her daily life.||Her father has benefited too: their walks give them time to talk without checking their phones.", "category": "Reading comprehension", "originalType": "mc", "solution": "Small Changes That Support Health and Family Life"}, {"id": 2, "type": "mc", "prompt": "What did Linh initially believe about getting healthier?", "options": ["It required costly equipment and lengthy exercise.", "It meant avoiding all her favourite food.", "It required no changes to her routine.", "It depended only on sleeping longer."], "answers": ["A"], "en": "Her original belief concerned equipment and exercise time.", "vi": "Ban đầu Linh nghĩ cần thiết bị đắt tiền và nhiều giờ tập luyện.", "evidence": "She believed that getting healthier required expensive equipment and hours of exercise.", "category": "Reading comprehension", "originalType": "mc", "solution": "It required costly equipment and lengthy exercise."}, {"id": 3, "type": "mc", "prompt": "Which change did Linh make?", "options": ["She exercised for several hours every evening.", "She stopped having any meals with her family.", "She replaced some sugary drinks with water.", "She stopped reading food labels."], "answers": ["C"], "en": "This change is directly stated.", "vi": "Thông tin này được nêu trực tiếp.", "evidence": "She also replaced some sugary drinks with water and started reading food labels.", "category": "Reading comprehension", "originalType": "mc", "solution": "She replaced some sugary drinks with water."}, {"id": 4, "type": "mc", "prompt": "What does “it” in “how often she ate it” refer to?", "options": ["A food label", "Breakfast only", "Food she enjoyed", "Water"], "answers": ["C"], "en": "The pronoun refers back to the food.", "vi": "Đại từ thay cho món ăn cô thích.", "evidence": "Instead of giving up every food she enjoyed, she paid attention to how often she ate it.", "category": "Reading comprehension", "originalType": "mc", "solution": "Food she enjoyed"}, {"id": 5, "type": "mc", "prompt": "“Benefited” is CLOSEST in meaning to _____.", "options": ["become worried", "followed an instruction", "spent more time working", "gained something positive"], "answers": ["D"], "en": "To benefit is to gain a positive result.", "vi": "Benefit nghĩa là nhận được lợi ích.", "evi  allow Linh to check messages.", "They have made Linh dislike spending time at home."], "answers": ["B"], "en": "Phone-free time allows them to communicate.", "vi": "Khoảng thời gian không dùng điện thoại giúp hai bố con trò chuyện.", "evidence": "Her father has benefited too: their walks give them time to talk without checking their phones.", "category": "Reading comprehension", "originalType": "mc", "solution": "They have created opportunities for family communication."}, {"id": 10, "type": "mc", "prompt": "Why does the writer mention living conditions?", "options": ["To explain why teenagers should stop exercising", "To show that health depends on more than habits", "To show that personal choices never matter", "To recommend expensive housing"], "answers": ["B"], "en": "Health has other influences besides personal habits.", "vi": "Sức khỏe còn chịu ảnh hưởng từ yếu tố ngoài thói quen.", "evidence": "Living conditions and access to medical care also influence health.", "category": "Reading comprehension", "originalType": "mc", "solution": "To show that health depends on more than habits"}, {"id": 11, "type": "mc", "prompt": "Linh _____ more active since she changed her routine.", "options": ["has become", "becomes", "is becoming", "became"], "answers": ["A"], "en": "Use present perfect with since for a change connected to now.", "vi": "Dùng hiện tại hoàn thành với since, nối quá khứ với hiện tại.", "evidence": "Linh _____ more active since she changed her routine.", "category": "Grammar & chunks", "originalType": "mc", "solution": "has become"}, {"id": 12, "type": "mc", "prompt": "She _____ walking with her father two months ago.", "options": ["is starting", "starts", "has started", "started"], "answers": ["D"], "en": "Ago marks a finished past time.", "vi": "Ago chỉ thời điểm quá khứ đã kết thúc: dùng quá khứ đơn.", "evidence": "She _____ walking with her father two months ago.", "category": "Grammar & chunks", "originalType": "mc", "solution": "started"}, {"id":  "mc", "prompt": "Linh now exercises _____. (REGULAR)", "answers": ["C"], "en": "An adverb modifies exercises.", "vi": "Cần trạng từ bổ nghĩa cho động từ exercises.", "evidence": "Linh now exercises _____. (REGULAR)", "category": "Word formation", "originalType": "wf", "options": ["regularity", "regular", "regularly", "irregular"], "solution": "regularly"}, {"id": 19, "type": "mc", "prompt": "Physical _____ is important for teenagers. (ACTIVE)", "answers": ["B"], "en": "Use the noun phrase physical activity.", "vi": "Physical activity: hoạt động thể chất.", "evidence": "Physical _____ is important for teenagers. (ACTIVE)", "category": "Word formation", "originalType": "wf", "options": ["active", "activity", "activate", "actively"], "solution": "activity"}, {"id": 20, "type": "mc", "prompt": "Everyone should have access to medical _____. (TREAT)", "answers": ["C"], "en": "Medical modifies a noun.", "vi": "Sau medical cần danh từ: sự điều trị.", "evidence": "Everyone should have access to medical _____. (TREAT)", "category": "Word formation", "originalType": "wf", "options": ["treat", "treating", "treatment", "treated"], "solution": "treatment"}, {"id": 21, "type": "mc", "prompt": "What does the passage mainly discuss?", "options": ["Why teenagers should avoid clubs", "How listening can improve a family disagreement", "How to run a photography business", "Why grandparents should make every decision"], "answers": ["B"], "en": "The story shows a disagreement being managed through listening.", "vi": "Bài cho thấy lắng nghe giúp xử lý bất đồng.", "evidence": "Each person would explain their opinion without interruption.||For Minh’s family, calm discussion was more useful than proving who was right.", "category": "Reading comprehension", "originalType": "mc", "solution": "How listening can improve a family disagreement"}, {"id": 22, "type": "mc", "prompt": "Why did Minh’s mother initially refuse?", "options": ["She worried that the club would affect his studies.", "The club met every evening.", "She disliked the club’s teachers.", "Minh had already lost his savings."], "answers": ["A"], "en": "She feared distraction from studies.", "vi": "Mẹ lo Minh xao nhãng học tập.", "evidence": "She believed it would distract him from his studies.", "category": "Reading comprehension", "originalType": "mc", "solution": "She worried that the club would affect his studies."}, {"id": 23, "type": "mc", "prompt": "Who suggested a new way to discuss the problem?", "options": ["Minh’s grandmother", "Minh’s teacher", "Minh’s father", "Minh’s mother"], "answers": ["A"], "en": "His grandmother suggested the approach.", "vi": "Bà là người đề xuất cách trao đổi mới.", "evidence": "At the next family meeting, Minh’s grandmother suggested a different approach.", "category": "Reading comprehension", "originalType": "mc", "solution": "Minh’s grandmother"}, {"id": 24, "type": "mc", "prompt": "What did Minh show his mother?", "options": ["A letter from his teacher", "A timetable including schoolwork and chores", "A collection of bus tickets", "A list of cameras"], "answers": ["B"], "en": "His timetable covered both responsibilities.", "vi": "Lịch gồm cả học tập và việc nhà.", "evidence": "He also showed her a timetable that included schoolwork and household chores.", "category": "Reading comprehension", "originalType": "mc", "solution": "A timetable including schoolwork and chores"}, {"id": 25, "type": "mc", "prompt": "What does “her” in “He also showed her a timetable” refer to?", "options": ["Minh’s grandmother", "A club member", "Minh’s mother", "Minh’s teacher"], "answers": ["C"], "en": "He was explaining the arrangement to his mother.", "vi": "Minh đang giải thích và đưa lịch cho mẹ.", "evidence": "Minh’s mother said she worried about unfinished homework and travel costs.||He also showed her a timetable that included schoolwork and household chores.", "category": "Reading comprehension", "originalType": "mc", "solution": "Minh’s mother"}, {"id": 26, "type": "mc", "prompt": "“Keeping an open mind” is CLOSEST in meaning to _____.", "options": ["considering different ideas fairly", "avoiding difficult discussions", "accepting every suggestion immediately", "forgetting all previous experiences"], "answers": ["A"], "en": "An open mind considers other viewpoints.", "vi": "Cởi mở là xem xét công bằng các góc nhìn khác.", "evidence": "However, keeping an open mind can prevent differences from becoming serious conflicts.||It means trying to understand someone before making a decision.", "category": "Reading comprehension", "originalType": "mc", "solution": "considering different ideas fairly"}, {"id": 27, "type": "mc", "prompt": "“Rejecting” is OPPOSITE in meaning to _____.", "options": ["accepting", "discussing", "questioning", "reviewing"], "answers": ["A"], "en": "Reject and accept are opposites.", "vi": "Reject là bác bỏ; accept là chấp nhận.", "evidence": "His mother would review the arrangement after four weeks instead of rejecting it immediately.", "category": "Reading comprehension", "originalType": "mc", "solution": "accepting"}, {"id": 28, "type": "mc", "prompt": "Which statement is NOT true?", "options": ["Minh would help pay for travel.", "The club met twice a month.", "The arrangement would be reviewed.", "Minh could attend without completing his homework."], "answers": ["D"], "en": "Homework had to be finished first.", "vi": "Phải hoàn thành bài tập trước khi tham gia.", "evidence": "Minh would finish his homework before attending and contribute to the travel costs with his savings.", "category": "Reading comprehension", "originalType": "mc", "solution": "Minh could attend without completing his homework."}, {"id": 29, "type": "mc", "prompt": "What can be inferred about the timetable?", "options": ["It allowed Minh to stop doing chores.", "It helped Minh demonstrate responsibility.", "It showed that Minh no longer needed to study.", "It made travel costs disappear."], "answers": ["B"], "en": "Planning for work and ammar & chunks", "originalType": "mc", "solution": "has to"}, {"id": 34, "type": "mc", "prompt": "Members can borrow cameras. Minh _____ buy one.", "options": ["has to", "must", "doesn’t have to", "mustn’t"], "answers": ["C"], "en": "Buying one is unnecessary, not forbidden.", "vi": "Không cần mua, không có nghĩa là cấm mua.", "evidence": "Members can borrow cameras. Minh _____ buy one.", "category": "Grammar & chunks", "originalType": "mc", "solution": "doesn’t have to"}, {"id": 35, "type": "mc", "prompt": "His mother now approves _____ the trial arrangement.", "options": ["of", "at", "to", "for"], "answers": ["A"], "en": "Use approve of.", "vi": "Approve of: tán thành.", "evidence": "His mother now approves _____ the trial arrangement.", "category": "Grammar & chunks", "originalType": "mc", "solution": "of"}, {"id": 36, "type": "mc", "prompt": "_____ their opinions differ, they can discuss them respectfully.", "options": ["Therefore", "Although", "Because of", "Despite"], "answers": ["B"], "en": "Although introduces a contrasting clause.", "vi": "Although + mệnh đề diễn tả nhượng bộ.", "evidence": "_____ their opinions differ, they can discuss them respectfully.", "category": "Grammar & chunks", "originalType": "mc", "solution": "Although"}, {"id": 37, "type": "mc", "prompt": "Better _____ helped the family resolve the problem. (COMMUNICATE)", "answers": ["A"], "en": "A noun is needed as the subject.", "vi": "Cần danh từ làm chủ ngữ: sự giao tiếp.", "evidence": "Better _____ helped the family resolve the problem. (COMMUNICATE)", "category": "Word formation", "originalType": "wf", "options": ["communication", "communicative", "communicate", "communicatively"], "solution": "communication"}, {"id": 38, "type": "mc", "prompt": "Minh accepted _____ for his schoolwork. (RESPONSIBLE)", "answers": ["A"], "en": "Use accept responsibility for.", "vi": "Accept responsibility for: nhận trách nhiệm về.", "evidence": "Minh accepted _____ for his schoolwork. (RESPONSIBLE)", "cat const AUDIO=[{"src": "reading-1.mp3", "cues": [{"start": 2.941, "end": 7.137}, {"start": 7.433, "end": 11.94}, {"start": 12.191, "end": 16.869}, {"start": 17.176, "end": 21.683}, {"start": 22.162, "end": 25.194}, {"start": 25.459, "end": 29.35}, {"start": 29.662, "end": 34.18}, {"start": 34.634, "end": 38.887}, {"start": 39.137, "end": 43.495}, {"start": 43.943, "end": 46.221}, {"start": 46.459, "end": 49.71}, {"start": 49.979, "end": 53.72}, {"start": 53.934, "end": 58.245}, {"start": 58.843, "end": 62.483}, {"start": 62.706, "end": 65.746}, {"start": 66.062, "end": 70.024}, {"start": 70.255, "end": 75.22}]}, {"src": "reading-2.mp3", "cues": [{"start": 2.286, "end": 5.993}, {"start": 6.281, "end": 8.544}, {"start": 8.94, "end": 12.951}, {"start": 13.3, "end": 16.867}, {"start": 17.501, "end": 21.38}, {"start": 21.762, "end": 24.745}, {"start": 25.243, "end": 29.021}, {"start": 29.445, "end": 33.912}, {"start": 34.268, "end": 37.88}, {"start": 38.323, "end": 40.148}, {"start": 40.473, "end": 45.059}, {"start": 45.408, "end": 49.518}, {"start": 49.964, "end": 53.008}, {"start": 53.529, "end": 57.394}, {"start": 57.795, "end": 61.996}, {"start": 62.36, "end": 66.585}, {"start": 66.947, "end": 69.033}, {"start": 69.398, "end": 72.184}, {"start": 72.648, "end": 76.39}]}, {"src": "", "cues": []}, {"src": "", "cues": []}, {"src": "", "cues": []}];
const state={answers:{},checked:{},index:1,sound:true,running:false,remaining:5400,end:0,mode:'practice',vi:false,highlights:true,sentence:0,picked:[],bank:[],built:{},known:{},vocab:0};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const section=()=>Math.floor((state.index-1)/20),question=()=>DATA.questions[state.index-1],passage=()=>DATA.passages[section()];
let ac,audioRun=0,audioFrame=0,soundNodes=[];
function chime(ok){soundNodes.forEach(o=>{try{o.stop()}catch(e){}});soundNodes=[];if(!state.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();[ok?660:240,ok?880:175].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.13;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.08,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g);g.connect(ac.destination);soundNodes.push(o);o.start(t);o.stop(t+.18);});}catch(e){}}
function stopAudio(reset=false){audioRun++;cancelAnimationFrame(audioFrame);const a=$('#audio');a.pause();if(reset&&a.src)a.currentTime=0;$$('.playing').forEach(e=>e.classList.remove('playing'));}
function audioSetup(){const a=$('#audio'),config=AUDIO[section()];a.hidden=!config.src;$('#audioTools').hidden=!config.src;if(config.src&&a.getAttribute('src')!==config.src){a.src=config.src;a.load();}else if(!config.src){a.removeAttribute('src');}a.ontimeupdate=()=>{const t=a.currentTime;$$('[data-sentence]').forEach(e=>{const cue=config.cues[+e.dataset.sentence];e.classList.toggle('playing',!!cue&&t>=cue.start&&t<cue.end);});};}
async function listenSentence(n){audioSetup();const c=AUDIO[section()],cue=c.cues[n];if(!c.src||!cue)return;stopAudio();const token=audioRun,a=$('#audio');a.currentTime=cue.start;try{await a.play();if(token!==audioRun){a.pause();return;}const tick=()=>{if(token!==audioRun)return;if(a.currentTime>=cue.end){a.pause();return;}audioFrame=requestAnimationFrame(tick)};tick();}catch(e){}}
function updateStats(){const n=Object.keys(state.checked).length,score=Object.values(state.checked).filter(Boolean).length;$('#score').textContent=`Score: ${score}/100`;$('#done').textContent=`Done: ${n}/100`;$('#progress').style.width=n+'%';const m=Math.floor(state.remaining/60),s=state.remaining%60;$('#timer').textContent=`${state.running?'Pause':state.remaining===5400?'Start':'Resume'} · ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function startTimer(){state.end=Date.now()+state.remaining*1000;state.running=true;updateStats()}
function gapHTML(n){const q=DATA.questions[n-1],letter=state.answers[n],checked=n in state.checked;const value=letter?q.options['ABCD'.indexOf(letter)]:'_____';return `<button class="inlinegap ${n===state.index?'selected':''} ${checked?(state.checked[n]?'correct':'wrong'):''}" data-gap="${n}" aria-label="Go to gap ${n}"><sup>${n}</sup> ${esc(value)}</button>`;}
function lexical(text){if(!state.highlights)return esc(text);const vocab=passage().vocab;const terms=vocab.map((v,i)=>({term:v.term,i})).sort((a,b)=>b.term.length-a.term.length);let pos=0,out='';while(pos<text.length){let best=null;for(const t of terms){let at=text.indexOf(t.term,pos);if(at>=0&&(!best||at<best.at||(at===best.at&&t.term.length>best.term.length)))best={...t,at};}if(!best){out+=esc(text.slice(pos));break;}out+=esc(text.slice(pos,best.at))+`<button class="lex ${best.i%2?'gold':'mint'}" data-vocab="${best.i}" aria-label="Study ${esc(best.term)}">${esc(best.term)}</button>`;pos=best.at+best.term.length;}return out;}
function sourceHTML(s,practice){if(!practice)return lexical(s);return s.split(/(\{\d+\})/).map(part=>/^\{\d+\}$/.test(part)?gapHTML(+part.slice(1,-1)):lexical(part)).join('');}
function evidenceSentences(){if(state.mode!=='practice'||!(state.index in state.checked)||question().category!=='Reading comprehension')return [];return question().evidence.split('||');}
function renderPassage(){const p=passage(),practice=state.mode==='practice';$('#title').textContent=p.title;$('#passageLabel').textContent=`Text ${section()+1} · ${section()<2?'Reading':'Reading cloze'}`;let si=0,ev=evidenceSentences();$('#text').innerHTML=p.paragraphs.map((raw,pi)=>{const sentences=p.sentences.filter(s=>s.paragraph===pi);const rawSentences=raw.match(/[^.!?]+[.!?]+(?:\s|$)/g)||[raw];let h=sentences.map((s,j)=>{const k=si++,matched=ev.includes(s.en);return `<span class="source-sentence ${matched?'evidence':''}" data-sentence="${k}">${sourceHTML(practice?rawSentences[j].trim():s.en,practice)}</span>`}).join(' ');return `<div class="paragraph"><p><span class="pnum">${pi+1}</span>${h}</p>${state.vi?`<p class="translation vi">${esc(p.vi[pi].join(' '))}</p>`:''}</div>`;}).join('');$('#vocabShelf').hidden=state.mode!=='read';$('#vocabShelf').innerHTML=`<h3>Words & chunks</h3><div class="vocabtags">${p.vocab.map((v,i)=>`<button data-vocab="${i}">${esc(v.term)}</button>`).join('')}</div>`;bindVocab();$$('[data-gap]').forEach(b=>b.onclick=()=>go(+b.dataset.gap));audioSetup();}
function bindVocab(){$$('[data-vocab]').forEach(b=>b.onclick=()=>openVocab(+b.dataset.vocab));}
function showEvidence(){setMobile('passage');const first=$('.evidence');if(first)first.scrollIntoView({block:'center',behavior:'smooth'});}
function renderQuestion(){const q=question(),checked=q.id in state.checked;$('#kind').textContent=q.category;$('#qcount').textContent=`Question ${q.id} / 100`;let h=`<div class="qtitle">${esc(q.prompt)}</div>`;if(q.originalType==='cloze')h+=`<div class="context">${esc(q.evidence).replace(/\{(\d+)\}/g,(_,n)=>+n===q.id?'<b>_____</b>':gapValue(+n))}</div>`;
h+='<div class="choices">'+q.options.map((o,i)=>{const key='ABCD'[i],sel=state.answers[q.id]===key;return `<button class="choice ${sel?'selected':''} ${checked?(key===q.answers[0]?'correct':sel?'wrong':''):''}" data-choice="${key}" aria-pressed="${sel}" ${checked?'disabled':''}><span class="letter">${key}.</span><span>${esc(o)}</span></button>`}).join('')+'</div>';
if(!checked)h+='<button class="check" id="check">Check Answer</button><div class="message" id="message" role="status"></div>';
else{const ok=state.checked[q.id];const ev=q.evidence.split('||').map(t=>esc(t).replace(/\{(\d+)\}/g,(_,n)=>+n===q.id?`<strong>${esc(q.solution)}</strong>`:gapValue(+n))).join('<br><br>');h+=`<div class="feedback ${ok?'':'wrong'}" role="status"><div class="verdict">${ok?'✓ Correct':'✕ Not quite'}</div><div class="answer">${q.answers[0]}. ${esc(q.solution)}</div><div class="explain"><p><strong>EN</strong> · ${esc(q.en)}</p><p class="vi"><strong>VI</strong> · ${esc(q.vi)}</p></div><span class="eyebrow">${q.category==='Reading comprehension'?'Evidence':'Language evidence'}</span><blockquote>${ev}</blockquote>${q.category==='Reading comprehension'?'<button class="reviewbtn" id="showEvidence">View evidence</button>':''}</div>`;}
$('#question').innerHTML=h;$$('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[q.id]=b.dataset.choice;renderQuestion();renderPassage();});if($('#check'))$('#check').onclick=checkAnswer;if($('#showEvidence'))$('#showEvidence').onclick=showEvidence;
$('#goto').innerHTML=Array.from({length:20},(_,i)=>{const n=section()*20+i+1;return `<option value="${n}" ${n===q.id?'selected':''}>Question ${n}</option>`}).join('');$('.navgrid').innerHTML=Array.from({length:20},(_,i)=>{let n=section()*20+i+1;return `<button class="qnav ${n===q.id?'current':''} ${n in state.checked?(state.checked[n]?'correct':'wrong'):''}" data-q="${n}">${n}</button>`}).join('');$$('[data-q]').forEach(b=>b.onclick=()=>go(+b.dataset.q));$('#prev').disabled=q.id===1;$('#next').disabled=q.id===100;updateStats();}
function gapValue(n){const q=DATA.questions[n-1],a=state.answers[n];return a?esc(q.options['ABCD'.indexOf(a)]):'_____';}
function checkAnswer(){const q=question();if(q.id in state.checked)return;if(!state.answers[q.id]){$('#message').textContent='Choose an answer first.';return;}stopAudio();if(!state.running&&state.remaining===5400)startTimer();state.checked[q.id]=state.answers[q.id]===q.answers[0];chime(state.checked[q.id]);renderQuestion();renderPassage();}
function setMobile(v){$('.workspace').dataset.mobile=v;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));}
function renderTabs(){$('.tabs').innerHTML=DATA.passages.map((p,i)=>`<button class="tab ${i===section()?'active':''}" data-section="${i}" title="${esc(p.title)}">${i<2?'Reading '+(i+1):'Cloze '+(i-1)}</button>`).join('');$$('[data-section]').forEach(b=>b.onclick=()=>{stopAudio();state.index=+b.dataset.section*20+1;state.sentence=0;state.vi=false;newSentence();renderAll();});$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));$('#viToggle').textContent='VI · '+(state.vi?'ON':'OFF');$('#hlToggle').textContent='Highlights · '+(state.highlights?'ON':'OFF');$('#instruction').textContent=state.mode==='practice'?'Choose the best answer':state.mode==='read'?'Read · Tap a highlighted expression':'Build the original sentence';}
function go(n){if(n<1||n>100)return;const old=section();state.index=n;stopAudio();if(section()!==old){state.vi=false;state.sentence=0;newSentence();}renderAll();$('.questionpane').scrollTop=0;const gap=document.querySelector(`[data-gap="${n}"]`);if(gap)gap.scrollIntoView({block:'center',behavior:'smooth'});}
function renderAll(){const m=state.mode;$('.workspace').hidden=m==='sentence';$('#sentencePanel').hidden=m!=='sentence';$('.questionpane').hidden=m==='read';$('.workspace').classList.toggle('reading-only',m==='read');$('#gotoLabel').hidden=m!=='practice';$('.viewtabs').classList.toggle('practice-only',m==='practice');$('.footnav').hidden=m!=='practice';renderTabs();if(m==='sentence'){audioSetup();renderSentence();}else{renderPassage();if(m==='practice')renderQuestion();}updateStats();}
function shuffle(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}if(x.length>1&&x.every((v,i)=>v===a[i]))x.push(x.shift());return x;}
function newSentence(){state.picked=[];const s=passage().sentences[state.sentence];state.bank=shuffle(s.chunks.map((_,i)=>i));}
function renderSentence(){const p=passage(),s=p.sentences[state.sentence],cue=AUDIO[section()].cues[state.sentence],key=section()+':'+state.sentence;$('#sentencePanel').innerHTML=`<div class="sentencecard"><div class="qhead"><span class="eyebrow">Sentence builder · Paragraph ${s.paragraph+1}</span><span id="buildCount">${Object.keys(state.built).filter(k=>k.startsWith(section()+':')).length}/${p.sentences.length} complete</span></div><div class="sentence-top"><h2>Sentence ${state.sentence+1} / ${p.sentences.length}</h2><select id="sentenceGo" aria-label="Go to sentence">${p.sentences.map((_,i)=>`<option value="${i}" ${i===state.sentence?'selected':''}>Sentence ${i+1}</option>`).join('')}</select></div><div class="sentence-actions"><button id="listenSentence" ${cue&&AUDIO[section()].src?'':'disabled'} title="${cue?'Listen to the current sentence':'Audio will be added'}">▶ Listen to sentence</button><button id="stopSentence">■ Stop</button><button id="sentenceVI">Show Vietnamese</button></div><div id="sentenceHint" class="vi hintbox" hidden>${esc(s.vi)}</div><div class="chunkzone" id="builtChunks">${state.picked.length?state.picked.map((n,i)=>`<button data-return="${i}" class="chunk">${esc(s.chunks[n])}</button>`).join(''):'<span>Tap the chunks to build the original sentence.</span>'}</div><div class="chunkbank">${state.bank.filter(n=>!state.picked.includes(n)).map(n=>`<button data-chunk="${n}" class="chunk">${esc(s.chunks[n])}</button>`).join('')}</div><div class="buildnav"><button id="sentencePrev" ${state.sentence===0?'disabled':''}>← Prev</button><button id="sentenceCheck" class="check">Check</button><button id="sentenceNext" ${state.sentence===p.sentences.length-1?'disabled':''}>Next →</button></div><div class="sentence-actions"><button id="sentenceClear">Clear</button><button id="sentenceHintBtn">Hint</button><button id="sentenceAnswer">Show Answer</button></div><div id="buildFeedback" role="status"></div></div>`;
$$('[data-chunk]').forEach(b=>b.onclick=()=>{state.picked.push(+b.dataset.chunk);renderSentence();});$$('[data-return]').forEach(b=>b.onclick=()=>{state.picked.splice(+b.dataset.return,1);renderSentence();});$('#sentenceGo').onchange=e=>changeSentence(+e.target.value);$('#sentencePrev').onclick=()=>changeSentence(state.sentence-1);$('#sentenceNext').onclick=()=>changeSentence(state.sentence+1);$('#sentenceVI').onclick=()=>{const el=$('#sentenceHint');el.hidden=!el.hidden;$('#sentenceVI').textContent=el.hidden?'Show Vietnamese':'Hide Vietnamese';};$('#sentenceClear').onclick=()=>{stopAudio();newSentence();renderSentence();};$('#sentenceCheck').onclick=()=>{stopAudio();const ok=state.picked.length===s.chunks.length&&state.picked.every((n,i)=>n===i);if(ok){state.built[key]=true;$('#buildCount').textContent=Object.keys(state.built).filter(k=>k.startsWith(section()+':')).length+'/'+p.sentences.length+' complete';}chime(ok);$('#buildFeedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}">${ok?'✓ Correct · Đúng thứ tự câu gốc.':'Not yet in the source order. · Chưa khớp thứ tự câu gốc.'}</div>`;};$('#sentenceAnswer').onclick=()=>{$('#buildFeedback').innerHTML=`<div class="feedback"><strong>${esc(s.en)}</strong><p class="vi">${esc(s.vi)}</p></div>`;};$('#sentenceHintBtn').onclick=()=>{const f=$('#buildFeedback');f.innerHTML=f.dataset.hint?'':`<div class="feedback">Start with: <strong>${esc(s.chunks[0])}</strong></div>`;f.dataset.hint=f.dataset.hint?'':'1';};$('#listenSentence').onclick=()=>listenSentence(state.sentence);$('#stopSentence').onclick=()=>stopAudio();}

function renderVocab(){const p=passage(),v=p.vocab[state.vocab],s=p.sentences[v.sentence],study=state.mode!=='practice'||section()<2;let source=s.en;if(!study){const raw=p.paragraphs[s.paragraph];const sentences=raw.match(/[^.!?]+[.!?]+(?:\s|$)/g)||[raw];source=sentences.find(t=>t.includes(v.term))||'';source=source.replace(/\{(\d+)\}/g,(_,n)=>n in state.checked?DATA.questions[n-1].solution:'_____');}$('#vocabInner').innerHTML=`<div class="vocabtop"><span class="eyebrow">${esc(v.kind)}</span><button id="closeVocab" aria-label="Close vocabulary">×</button></div><h2>${esc(v.term)}</h2><p class="vmeaning">${esc(v.vi)}</p><div class="vexample">${esc(source).replace(esc(v.term),`<strong>${esc(v.term)}</strong>`)}</div><p class="vi vtranslation">${esc(s.vi)}</p><div class="sentence-actions"><button id="vocabListen" ${AUDIO[section()].src&&AUDIO[section()].cues[v.sentence]?'':'disabled'} title="Listen to the source sentence">▶ Listen to sentence</button><button id="vocabStop">■ Stop</button></div><div class="vocabnav"><button id="vocabPrev" ${state.vocab===0?'disabled':''}>←</button><span>${state.vocab+1} / ${p.vocab.length}</span><button id="vocabNext" ${state.vocab===p.vocab.length-1?'disabled':''}>→</button></div><div class="vocabfoot"><button id="knowWord">${state.known[section()+':'+state.vocab]?'✓ Known':'I know this'}</button><button id="studyWord">Study sentence</button></div>`;$('#vocabListen').onclick=()=>listenSentence(v.sentence);$('#vocabStop').onclick=()=>stopAudio();$('#closeVocab').onclick=()=>{stopAudio();$('#vocabDialog').close();};$('#vocabPrev').onclick=()=>{stopAudio();state.vocab--;renderVocab();};$('#vocabNext').onclick=()=>{stopAudio();state.vocab++;renderVocab();};$('#knowWord').onclick=()=>{state.known[section()+':'+state.vocab]=true;renderVocab();};$('#studyWord').onclick=()=>{$('#vocabDialog').close();stopAudio();state.mode='sentence';state.sentence=v.sentence;newSentence();renderAll();};}
$$('[data-mode]').forEach(b=>b.onclick=()=>{stopAudio();state.mode=b.dataset.mode;state.vi=false;if(state.mode==='sentence')newSentence();renderAll();});$('#viToggle').onclick=()=>{state.vi=!state.vi;renderTabs();if(state.mode!=='sentence')renderPassage();};$('#hlToggle').onclick=()=>{state.highlights=!state.highlights;renderTabs();if(state.mode!=='sentence')renderPassage();};$('#audioStop').onclick=()=>stopAudio(true);$('#audioSpeed').onchange=e=>{$('#audio').playbackRate=+e.target.value;};$('#goto').onchange=e=>go(+e.target.value);$('#prev').onclick=()=>go(state.index-1);$('#next').onclick=()=>go(state.index+1);$$('[data-view]').forEach(b=>b.onclick=()=>setMobile(b.dataset.view));$('#sound').onclick=()=>{state.sound=!state.sound;if(!state.sound)soundNodes.forEach(o=>{try{o.stop()}catch(e){}});$('#sound').textContent='Sound: '+(state.sound?'ON':'OFF');$('#sound').setAttribute('aria-pressed',state.sound);};$('#timer').onclick=()=>{if(state.remaining===0)return;if(state.running){state.remaining=Math.max(0,Math.ceil((state.end-Date.now())/1000));state.running=false;}else startTimer();updateStats();};setInterval(()=>{if(!state.running)return;state.remaining=Math.max(0,Math.ceil((state.end-Date.now())/1000));if(state.remaining===0){state.running=false;stopAudio();$('#timeSummary').textContent=`Correct: ${Object.values(state.checked).filter(Boolean).length}/100`;$('#timeDialog').showModal();}updateStats();},250);$('#reset').onclick=()=>$('#resetDialog').showModal();$('#cancelReset').onclick=()=>$('#resetDialog').close();$('#confirmReset').onclick=()=>{stopAudio(true);Object.assign(state,{answers:{},checked:{},index:1,running:false,remaining:5400,vi:false,sentence:0,built:{},known:{}});newSentence();$('#resetDialog').close();renderAll();};$('#closeTime').onclick=()=>$('#timeDialog').close();$('#vocabDialog').onclose=()=>stopAudio();$('#vocabDialog').onclick=e=>{if(e.target===$('#vocabDialog'))$('#vocabDialog').close();};newSentence();renderAll();
